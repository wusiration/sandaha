function validateFollow(cards, lead){
  if(!cards.length) return {ok:false,msg:'未选择牌'};
  if(lead.type==='throw') return validateFollowThrow(cards, lead);
  if(cards.length!==lead.cards.length) return {ok:false,msg:'必须出 '+lead.cards.length+' 张牌'};
  const leadCat = lead.category;
  const type = lead.type;
  const len = lead.cards.length;
  const hand=state.players[HUMAN_INDEX].hand;
  const handLead = hand.filter(c=>cardCategory(c)===leadCat);
  const avail = handLead.length;
  const must = Math.min(avail, len);
  const selectedLead = cards.filter(c=>cardCategory(c)===leadCat);
  if(selectedLead.length !== must){
    return {ok:false, msg:'该门牌你有 '+avail+' 张，必须出其中 '+must+' 张'};
  }
  if(must === len){
    // 主/花色够：必须全部跟该门，并满足对/拖拉机约束
    for(const c of cards) if(cardCategory(c)!==leadCat) return {ok:false,msg:'必须跟 '+categoryName(leadCat)};
    const groups = (leadCat==='trump') ? groupTrumpBySuitRank(hand,state.trumpSuit) : groupPlainByRank(hand,leadCat,state.trumpSuit);
    const ordered = (leadCat==='trump') ? orderedTrumpSuitRanks(state.trumpSuit).map(makeSuitRankKey) : orderedRanksPlain();
    const constraint = followConstraint(groups, ordered, type, len/2, leadCat, cards);
    if(!constraint.ok) return {ok:false,msg:constraint.msg};
    return {ok:true, type:type, category:leadCat};
  } else if(avail===0){
    // 缺门：可以主牌毙，也可以垫其他副牌
    const selectedCat = cardCategory(cards[0]);
    if(selectedCat==='trump'){
      if(!cards.every(c=>cardCategory(c)==='trump')) return {ok:false,msg:'用主牌毙时所有牌必须都是主牌'};
      const groups = groupTrumpBySuitRank(hand,state.trumpSuit);
      const ordered = orderedTrumpSuitRanks(state.trumpSuit).map(makeSuitRankKey);
      const constraint = followConstraint(groups, ordered, type, len/2, 'trump', cards);
      if(!constraint.ok) return {ok:false,msg:constraint.msg};
      return {ok:true, type:type, category:'trump'};
    } else {
      // 垫牌（任意花色均可），不能赢
      return {ok:true, type:type, category:'discard'};
    }
  } else {
    // 该门牌不够：必须出完全部该门牌，剩余用其他牌垫
    // 出的该门牌内部尽量满足对/拖拉机约束
    const groups = (leadCat==='trump') ? groupTrumpBySuitRank(hand,state.trumpSuit) : groupPlainByRank(hand,leadCat,state.trumpSuit);
    const ordered = (leadCat==='trump') ? orderedTrumpSuitRanks(state.trumpSuit).map(makeSuitRankKey) : orderedRanksPlain();
    const pairs = getPairs(groups, ordered);
    if(must>=2 && pairs.length>0 && !selectedHasPair(selectedLead, leadCat)){
      return {ok:false,msg:'该门牌有对子时必须出对子'};
    }
    if(type==='tractor' && must>=4){
      const needPairs = must/2;
      const tractors = getTractors(groups, ordered);
      if(tractors.some(t=>t.length===needPairs) && !selectedIsTractor(selectedLead, leadCat, needPairs)){
        return {ok:false,msg:'该门牌有拖拉机时必须出拖拉机'};
      }
    }
    return {ok:true, type:type, category:'discard'};
  }
}
function categoryName(cat){ return cat==='trump'?'主牌':SUITS[cat].name; }
function cardsSameCategory(cards){
  const cat = cardCategory(cards[0]);
  return cards.every(c=>cardCategory(c)===cat);
}
function selectedHasPair(cards, category){
  if(category==='trump'){
    const cnt={};
    for(const c of cards) if(isTrump(c,state.trumpSuit)){ const key=c.suit+'_'+c.rank; cnt[key]=(cnt[key]||0)+1; }
    return Object.values(cnt).some(n=>n>=2);
  } else {
    const cnt={};
    for(const c of cards) if(c.suit===category && !isTrump(c,state.trumpSuit)){ cnt[c.rank]=(cnt[c.rank]||0)+1; }
    return Object.values(cnt).some(n=>n>=2);
  }
}
function selectedIsTractor(cards, category, pairCount){
  return cards.length===pairCount*2 && isTractor(cards, category);
}
function followConstraint(groups, ordered, type, pairCount, category, selected){
  // groups: value/rank -> count in hand for the relevant category
  // type: 'single','pair','tractor'
  // pairCount: number of pairs in lead (1 for pair, k for tractor)
  if(type==='single') return {ok:true};
  const pairs = getPairs(groups, ordered);
  const tractors = getTractors(groups, ordered);
  if(type==='pair'){
    if(pairs.length>0 && !selectedHasPair(selected, category)){
      return {ok:false,msg:'有对子时必须出对子'};
    }
    return {ok:true};
  }
  if(type==='tractor'){
    const hasLen = tractors.some(t=>t.length===pairCount);
    if(hasLen && !selectedIsTractor(selected, category, pairCount)){
      return {ok:false,msg:'有拖拉机时必须出拖拉机'};
    }
    if(!hasLen && pairs.length>0 && !selectedHasPair(selected, category)){
      return {ok:false,msg:'有对子时必须出对子'};
    }
    return {ok:true};
  }
  return {ok:true};
}

// 甩牌跟牌验证
function validateFollowThrow(cards, lead){
  const units = lead.units;
  const total = lead.cards.length;
  if(cards.length !== total) return {ok:false, msg:'必须出 '+total+' 张牌'};
  // 方案A：甩牌只发生在主牌
  const hand = state.players[HUMAN_INDEX].hand;
  const handTrump = trumpCards(hand, state.trumpSuit);
  const selectedTrump = cards.filter(c=>cardCategory(c)==='trump');
  const avail = handTrump.length;
  const mustTrump = Math.min(avail, total);
  if(selectedTrump.length !== mustTrump){
    return {ok:false, msg:'你有 '+avail+' 张主牌，必须出其中 '+mustTrump+' 张'};
  }
  const needTractor = units.some(u=>u.type==='tractor');
  const needPair = units.some(u=>u.type==='pair');
  if(mustTrump === total){
    // 主牌够：必须全主牌，有结构时尽量满足结构
    const selectedUnits = splitToUnits(selectedTrump, 'trump');
    const handTrumpGroups = groupTrumpBySuitRank(handTrump, state.trumpSuit);
    const ordered = orderedTrumpSuitRanks(state.trumpSuit).map(makeSuitRankKey);
    const handTractors = getTractors(handTrumpGroups, ordered);
    const handPairs = getPairs(handTrumpGroups, ordered);
    if(needTractor && handTractors.length>0 && !selectedUnits.some(u=>u.type==='tractor')){
      return {ok:false, msg:'有拖拉机单元且你有拖拉机时必须出拖拉机'};
    }
    if(needPair && handPairs.length>0 && !selectedUnits.some(u=>u.type==='pair' || u.type==='tractor')){
      return {ok:false, msg:'有对子单元且你有对子时必须出对子'};
    }
    return {ok:true, type:'throw', category:'trump'};
  } else if(avail === 0){
    // 缺门：垫副牌
    return {ok:true, type:'throw', category:'discard'};
  } else {
    // 主牌不够：出完全部主牌，剩余垫副牌，有结构时尽量满足结构
    const selectedUnits = splitToUnits(selectedTrump, 'trump');
    const handTrumpGroups = groupTrumpBySuitRank(handTrump, state.trumpSuit);
    const ordered = orderedTrumpSuitRanks(state.trumpSuit).map(makeSuitRankKey);
    const handTractors = getTractors(handTrumpGroups, ordered);
    const handPairs = getPairs(handTrumpGroups, ordered);
    if(needTractor && handTractors.length>0 && !selectedUnits.some(u=>u.type==='tractor')){
      return {ok:false, msg:'有拖拉机单元且你有拖拉机时必须出拖拉机'};
    }
    if(needPair && handPairs.length>0 && !selectedUnits.some(u=>u.type==='pair' || u.type==='tractor')){
      return {ok:false, msg:'有对子单元且你有对子时必须出对子'};
    }
    return {ok:true, type:'throw', category:'discard'};
  }
}

async function playCards(idx, cards, info){
  const p=state.players[idx];
  for(const c of cards) p.hand.splice(p.hand.indexOf(c),1);
  const play = {playerIndex:idx, cards:cards, type:info.type, category:info.category};
  // compute max rank and effective type for this play
  if(info.type==='throw' && info.units){
    play.effectiveType = 'throw';
    play.units = info.units;
    play.maxRank = Math.max(...info.units.map(u=>u.maxRank));
  } else {
    play.effectiveType = effectiveType(cards, info.category);
    // 跟牌时如果实际构不成对子/拖拉机，不能当作甩牌来压过庄家的对子/拖拉机
    if(state.currentTrick.length>0 && play.effectiveType==='throw' && state.currentTrick[0].type!=='throw'){
      play.effectiveType = 'single';
    }
    play.maxRank = maxPlayRank(play);
  }
  state.currentTrick.push(play);
  recordPlay(idx, cards);
  log(state.players[idx].name+' 出 '+trickCardText(cards)+' ('+typeName(play.effectiveType)+')');
  clearSelection();
  renderAllHands();
  renderTrick();
  // 最新出的牌加动画
  const lastTrick = els.trickArea.lastElementChild;
  if(lastTrick) lastTrick.classList.add('animate-in');
  playSound('play');
  updateInfo();
  renderCardCounter();
  await sleep(300);
  if(state.currentTrick.length<4){
    state.turn = nextClockwise(state.turn);
    updateInfo();
    if(state.turn===HUMAN_INDEX){ showPanel('play'); showMessage('请出牌'); }
    else { showPanel(null); setTimeout(()=>aiTurn(), 600); }
  } else {
    await finishTrick();
  }
}
function typeName(t){ if(t==='single')return'单张'; if(t==='pair')return'对子'; if(t==='throw')return'甩牌'; return'拖拉机'; }
function maxPlayRank(play){
  if(play.category==='trump') return Math.max(...play.cards.map(c=>trumpRankValue(c,state.trumpSuit)));
  return Math.max(...play.cards.filter(c=>cardCategory(c)===play.category).map(c=>plainRankValue(c)));
}

async function aiTurn(){
  const idx=state.turn;
  if(state.currentTrick.length===0){ aiLead(idx); }
  else {
    const lead=state.currentTrick[0];
    const cand=aiChooseFollow(idx, lead);
    const info={type:lead.type, category:cand.category};
    await playCards(idx,cand.cards,info);
  }
}
async function aiLead(idx){
  const play=aiChooseLead(idx);
  const info=validateLead(play.cards);
  await playCards(idx, play.cards, info);
}

// -------------------- AI lead --------------------
function aiChooseLead(idx){
  const hand=state.players[idx].hand;
  const role = idx===state.dealerIndex?'dealer':'defender';
  const candidates=[];
  // trump candidates
  addCategoryCandidates(hand, 'trump', candidates);
  // throw candidates (trump only)
  addThrowCandidates(hand, candidates);
  // plain suit candidates
  for(const s of SUIT_KEYS) addCategoryCandidates(hand, s, candidates);
  if(candidates.length===0) return {cards:[hand[0]]};
  // score
  let best=null, bestScore=-9999;
  for(const cand of candidates){
    let sc=0;
    const cat=cand.category;
    const type=cand.type;
    const max=cand.maxRank;
    if(type==='throw'){
      // 甩牌：已通过最大性验证，奖励高分
      sc += 100 + cand.cards.length*5;
      if(role==='dealer') sc += 20;
      // 拖拉机甩牌更强
      if(cand.units && cand.units.some(u=>u.type==='tractor')) sc += 30;
      // 对手主牌少时，甩牌收益更高
      if(!isEasyAI() && remainingTrumpCount() < 8) sc += 15;
      // 若自己主牌也不多了，甩牌可以一次性清空，减少风险
      const myTrumpCount = trumpCards(hand, state.trumpSuit).length;
      if(cand.cards.length >= myTrumpCount * 0.7) sc += 10;
    } else if(role==='dealer'){
      if(cat==='trump'){
        sc += 50 + max*0.2 + (type==='tractor'?20:0) + (type==='pair'?10:0);
        // 主牌快出完时，出主逼牌价值降低
        const rem = remainingTrumpCount();
        if(rem < 6) sc -= 8;
      } else {
        // 庄家：牌力高的副牌（对A、对K、拖拉机）尽早出，趁闲家主牌没打完前抢墩
        const len=cand.cards.length;
        const isHigh = max >= 93; // A 或 K
        sc += max*0.5 + len*2;
        if(type==='tractor') sc += 45;
        else if(type==='pair' && isHigh) sc += 35;
        else if(type==='pair') sc += 15;
        else if(type==='single' && isHigh) sc += 12;
        // 记牌：对手都缺门时，这门副牌基本稳拿，奖励
        if(!isEasyAI() && allOpponentsVoid(idx, cat)) sc += (isHardAI()?30:20);
        // 对手在该门剩余越少，出这门越安全
        if(!isEasyAI()){
          const oppRem = opponentSuitRemaining(idx, cat);
          sc += Math.max(0, 12 - oppRem) * 0.8;
        }
        // 若外面还有更大牌，出小牌会被压，惩罚低牌单张
        if(!isEasyAI()){
          const higher = remainingHigherCards(cand.cards[0]);
          if(higher > 0) sc -= higher * (isHardAI()?6:4);
          else if(type==='single' && isHigh) sc += (isHardAI()?12:8); // 当前最大，可放心出
        }
        // 庄家优先出对子而非单张（对子更难被压）
        if(type==='pair' && !isEasyAI()) sc += 5;
      }
    } else {
      // defender: try capture points or draw trumps
      if(cat==='trump'){
        sc += 40 + max*0.15 + (type==='tractor'?15:0);
        const rem = remainingTrumpCount();
        if(rem < 5) sc += 10; // 主牌快出完时，闲家应积极逼主
      } else {
        // 闲家：有高牌力副牌也先出，逼庄家主牌或抢分
        sc += max*0.6 + cand.cards.length*1.5;
        if(type==='tractor') sc += 40;
        else if(type==='pair' && max>=93) sc += 30;
        else if(type==='pair') sc += 12;
        else if(type==='single' && max>=93) sc += 10;
        // 记牌：庄家已缺门，这门大牌更容易拿到
        if(!isEasyAI() && isVoid(state.dealerIndex, cat)) sc += (isHardAI()?22:15);
        // 同伴已缺门，则这门牌可能要靠我收，优先出
        const pi = partnerIndex(idx);
        if(!isEasyAI() && pi!=null && isVoid(pi, cat)) sc += (isHardAI()?15:10);
        // 若自己就是当前这门剩余最大，奖励
        if(!isEasyAI() && cand.cards.every(c=>isHighestRemainingCard(c))) sc += (isHardAI()?18:12);
        // 庄家在该门剩余越少，这门越值得攻击
        if(!isEasyAI()){
          const dealerRem = opponentSuitRemaining(state.dealerIndex, cat);
          sc += Math.max(0, 12 - dealerRem) * 0.8;
        }
        // 对子优先于单张
        if(type==='pair' && !isEasyAI()) sc += 5;
      }
    }
    // avoid leading low singletons unless no choice
    if(type==='single' && max < 80) sc -= 15;
    // 终局调整
    if(isEndgame()){
      const mult = isEasyAI()?0.5:(isHardAI()?1.5:1);
      const rem = remainingTricks();
      if(role==='dealer'){
        // 庄家最后一轮优先出主牌大牌保底
        if(isLastTrick() && cat==='trump') sc += (30 + max*0.2) * mult;
        // 避免在最后一轮出副牌让对手抠底
        if(isLastTrick() && cat!=='trump' && !allOpponentsVoid(idx, cat)) sc -= 40 * mult;
        // 剩余主牌不多时，出主逼牌价值降低
        if(cat==='trump' && remainingTrumpCount() <= rem) sc -= 10 * mult;
      } else {
        // 闲家最后一轮积极出主牌争取抠底
        if(isLastTrick() && cat==='trump'){
          sc += 35 * mult;
          if(type==='pair' || type==='tractor') sc += 25 * mult;
        }
        // 剩余分牌还很多但轮次不够时，要积极抢分
        const needed = (state.bid||0) - state.defenderPoints;
        if(needed > 0 && remainingPoints() <= needed + 10 && cat!=='trump'){
          sc += (max>=93 ? 15 : 8) * mult;
        }
      }
    }
    if(sc>bestScore){ bestScore=sc; best=cand; }
  }
  return best;
}
function addThrowCandidates(hand, list){
  const trump = trumpCards(hand, state.trumpSuit);
  if(trump.length < 2) return;
  const units = splitToUnits(trump, 'trump');
  if(units.every(u=>u.type==='single')) return; // 必须含对子或拖拉机
  const nonSingle = units.filter(u=>u.type!=='single');
  const singles = units.filter(u=>u.type==='single').sort((a,b)=>a.maxRank-b.maxRank);
  const candidateSets=[];
  candidateSets.push(units);
  if(nonSingle.length>=1 && nonSingle.reduce((s,u)=>s+u.cards.length,0)>=2){
    candidateSets.push(nonSingle);
  }
  if(singles.length>0 && nonSingle.length>=1){
    candidateSets.push([...nonSingle, singles[0]]);
  }
  for(const cu of candidateSets){
    const cards = cu.flatMap(u=>u.cards);
    if(cards.length < 2) continue;
    const v = validateThrow(cards, 'trump');
    if(v.ok){
      list.push({cards, type:'throw', category:'trump', units:v.units, maxRank: Math.max(...v.units.map(u=>u.maxRank))});
    }
  }
}
function addCategoryCandidates(hand, category, list){
  const isTrumpCat = category==='trump';
  const groups = isTrumpCat ? groupTrumpBySuitRank(hand,state.trumpSuit) : groupPlainByRank(hand,category,state.trumpSuit);
  const ordered = isTrumpCat ? orderedTrumpSuitRanks(state.trumpSuit).map(makeSuitRankKey) : orderedRanksPlain();
  // singles
  const cardsInCat = isTrumpCat ? trumpCards(hand,state.trumpSuit) : suitPlainCards(hand,category,state.trumpSuit);
  for(const c of cardsInCat){
    list.push({cards:[c], type:'single', category:category, maxRank: isTrumpCat?trumpRankValue(c,state.trumpSuit):plainRankValue(c)});
  }
  // pairs
  const pairs=getPairs(groups, ordered);
  for(const k of pairs){
    const pairCards = pickCardsForGroup(hand, category, k, 2);
    if(pairCards) list.push({cards:pairCards, type:'pair', category:category, maxRank: isTrumpCat?trumpKeyValue(k):PLAIN_RANK_ORDER[k]});
  }
  // tractors
  const tractors=getTractors(groups, ordered);
  for(const t of tractors){
    const tractorCards=[]; let ok=true;
    for(const k of t){
      const cs=pickCardsForGroup(hand,category,k,2);
      if(!cs){ ok=false; break; }
      tractorCards.push(...cs);
    }
    if(ok) list.push({cards:tractorCards, type:'tractor', category:category, maxRank: isTrumpCat?trumpKeyValue(t[0]):PLAIN_RANK_ORDER[t[0]]});
  }
}
function pickCardsForGroup(hand, category, key, n){
  const out=[];
  if(category==='trump'){
    const [suit,rank]=key.split('_');
    for(const c of hand){ if(isTrump(c,state.trumpSuit) && c.suit===suit && c.rank===rank && out.length<n) out.push(c); }
  } else {
    for(const c of hand){ if(c.suit===category && c.rank===key && !isTrump(c,state.trumpSuit) && out.length<n) out.push(c); }
  }
  return out.length===n?out:null;
}

// -------------------- AI follow --------------------
function aiChooseFollow(idx, lead){
  const hand=state.players[idx].hand;
  const role = idx===state.dealerIndex?'dealer':'defender';
  const leadCat=lead.category;
  const type=lead.type;
  const len=lead.cards.length;
  if(type==='throw') return aiChooseFollowThrow(idx, lead);
  // current winner info
  let winner=null, winnerCat=null, winnerMax=-1;
  for(const p of state.currentTrick){
    if(winner==null || playBeats(p, winnerCat, winnerMax, winner.effectiveType, lead.category)){ winner=p; winnerCat=p.category; winnerMax=p.maxRank; }
  }
  const winnerRole = winner.playerIndex===state.dealerIndex?'dealer':'defender';
  const partnerWinning = winnerRole===role;
  // build candidate plays
  const candidates=[];
  const handLead = hand.filter(c=>cardCategory(c)===leadCat);
  const avail = handLead.length;
  const must = Math.min(avail, len);
  if(must === len){
    // 该门牌足够：正常跟牌
    addFollowCandidates(hand, leadCat, type, len, candidates, true);
  } else if(avail===0){
    // 缺门：可主牌毙，也可垫副牌
    const hasTrump = hand.some(c=>cardCategory(c)==='trump');
    if(hasTrump){
      addFollowCandidates(hand, 'trump', type, len, candidates, false);
    }
    addDiscardCandidates(hand, len, candidates);
  } else {
    // 该门牌不够：必须出完全部该门牌，剩余用副牌垫
    const leadCards = selectMandatoryLeadCards(hand, leadCat, type, must);
    const discardCount = len - must;
    const discards = selectLowestDiscards(hand, leadCards, discardCount);
    candidates.push({cards:[...leadCards,...discards], category:'discard', maxRank:-1});
  }
  // choose
  let best=null, bestScore=-9999;
  const myPos = state.currentTrick.length;
  const isLastPlayer = myPos === 3;
  for(const cand of candidates){
    cand.effectiveType = effectiveType(cand.cards, cand.category);
    let wins=false;
    if(cand.category===leadCat || cand.category==='trump'){
      if(playBeats(cand, winnerCat, winnerMax, winner.effectiveType, leadCat)) wins=true;
    }
    const candPoints = cand.cards.reduce((s,c)=>s+scoreValue(c),0);
    let sc=0;
    if(partnerWinning){
      // 同伴已在赢墩：不要压过同伴，尽量把分牌垫给同伴
      if(wins) sc -= 1000 + cand.maxRank; // 强烈避免压同伴
      sc -= cand.maxRank * 0.5;
      // 队友明显大（最后一家或持有当前最大剩余牌）时，放心送分
      const partnerPlay = winner;
      const clearlyWinning = isLastPlayer || (!isEasyAI() && partnerPlay.cards.some(c=>isHighestRemainingCard(c)));
      if(candPoints > 0){
        const bonus = clearlyWinning ? (isHardAI()?8:6) : (isHardAI()?4:3);
        sc += candPoints * bonus;
      }
      if(cand.category==='discard') sc += (isHardAI()?15:10);
      // 同门跟牌时送分额外奖励
      if(clearlyWinning && cand.category===leadCat && candPoints>0) sc += candPoints * (isHardAI()?3:2);
    } else {
      // 对手在赢墩：尽量赢，否则少送分
      if(wins){
        // 闲家配合：避免两个闲家连续浪费主牌
        const partner = partnerIndex(idx);
        const partnerPlayedTrump = partner!=null && state.currentTrick.some(p=>p.playerIndex===partner && p.category==='trump');
        if(!isEasyAI() && role==='defender' && partnerPlayedTrump && !isLastPlayer) sc -= (isHardAI()?35:25);
        sc += 200 + (isLastPlayer?50:0) + candPoints * 2;
        sc -= cand.maxRank * 0.4;
        // 用主牌对子/拖拉机赢比较贵，稍微扣分
        if(cand.category==='trump' && cand.effectiveType!=='single') sc -= 8;
      } else {
        sc -= cand.maxRank * 0.3;
        // 避免把分牌垫给对手
        if(candPoints > 0) sc -= candPoints * (isHardAI()?7:5);
        // 若自己是最后一家且已无法赢，优先出最低牌
        if(isLastPlayer) sc -= 5;
        // 闲家：如果同伴还没出过牌，自己又不是最后一家，尽量让同伴先消耗主牌
        const partner = partnerIndex(idx);
        const partnerPlayed = partner!=null && state.currentTrick.some(p=>p.playerIndex===partner);
        if(!isEasyAI() && role==='defender' && !isLastPlayer && !partnerPlayed && cand.category==='trump') sc -= (isHardAI()?25:20);
        // 垫牌时优先垫对手已缺门或剩余大牌少的花色
        if(cand.category==='discard' && !isEasyAI()){
          const suit = cand.cards[0].suit;
          if(SUIT_KEYS.includes(suit)){
            if(opponentIndices(idx).some(i=>isVoid(i,suit))) sc += 8;
            const highRem = remainingPlainHigh(suit, 92);
            sc += Math.max(0, 4 - highRem) * 2;
          }
        }
      }
    }
    // 终局强化
    if(isEndgame()){
      if(role==='dealer'){
        if(isLastTrick()){
          // 最后一轮庄家必须保底
          if(wins) sc += 80;
          // 避免垫副牌让对手抠底
          if(cand.category!=='trump' && cand.category!==leadCat) sc -= 40;
        }
      } else {
        if(isLastTrick()){
          // 最后一轮闲家争取抠底
          if(wins && cand.category==='trump') sc += 80;
          // 有机会出主牌时积极一点
          if(cand.category==='trump') sc += 20;
        }
        // 分牌不够但剩余分牌多时，要积极抢分
        const needed = (state.bid||0) - state.defenderPoints;
        if(needed > 0 && remainingPoints() <= needed + 15 && wins) sc += 15;
      }
    }
    // 简单难度增加随机性，偶尔做出次优选择
    if(isEasyAI()) sc += (Math.random()-0.5) * 40;
    if(sc>bestScore){ bestScore=sc; best=cand; }
  }
  return best || {cards:hand.slice(0,len), category:'discard'};
}
function aiChooseFollowThrow(idx, lead){
  const hand=state.players[idx].hand;
  const total = lead.cards.length;
  const handTrump = trumpCards(hand, state.trumpSuit);
  const avail = handTrump.length;
  // 判断当前赢家是否为同伴
  let winner=null;
  for(const p of state.currentTrick){
    if(!winner || playBeats(p, winner.category, winner.maxRank, winner.effectiveType, lead.category)) winner=p;
  }
  const partnerWinning = winner && winner.playerIndex!==idx && (winner.playerIndex===state.dealerIndex)===(idx===state.dealerIndex);
  const avoidPts = !partnerWinning;
  if(avail === 0){
    return {cards: selectLowestDiscards(hand, [], total, avoidPts), category:'discard'};
  }
  if(avail >= total){
    // 主牌够：出最低 total 张主牌即可满足结构要求
    return {cards: lowestCards(handTrump, total), category:'trump'};
  }
  // 主牌不够：出全部主牌 + 最低副牌垫
  const discards = selectLowestDiscards(hand, handTrump, total - avail, avoidPts);
  return {cards:[...handTrump, ...discards], category:'discard'};
}
function lowestCards(cards, n, avoidPoints=false){
  return cards.slice().sort((a,b)=>{
    let av=cardSortValue(a,state.trumpSuit), bv=cardSortValue(b,state.trumpSuit);
    if(avoidPoints){ av += (scoreValue(a)>0?50:0); bv += (scoreValue(b)>0?50:0); }
    return av-bv;
  }).slice(0,n);
}
function selectMandatoryLeadCards(hand, cat, type, must){
  const catCards = cat==='trump' ? trumpCards(hand,state.trumpSuit) : suitPlainCards(hand,cat,state.trumpSuit);
  if(must<=0) return [];
  if(type==='single') return lowestCards(catCards, 1);
  const groups = cat==='trump' ? groupTrumpBySuitRank(hand,state.trumpSuit) : groupPlainByRank(hand,cat,state.trumpSuit);
  const ordered = cat==='trump' ? orderedTrumpSuitRanks(state.trumpSuit).map(makeSuitRankKey) : orderedRanksPlain();
  // 拖拉机且够一对对子时优先出拖拉机
  if(type==='tractor' && must>=4){
    const tractors = getTractors(groups, ordered);
    const needPairs = must/2;
    const availTractor = tractors.filter(t=>t.length===needPairs);
    if(availTractor.length>0){
      const t = availTractor[availTractor.length-1]; // 最小的拖拉机
      const cs=[]; let ok=true;
      for(const k of t){ const g=pickCardsForGroup(hand,cat,k,2); if(!g){ok=false;break;} cs.push(...g); }
      if(ok) return cs;
    }
  }
  const pairs = getPairs(groups, ordered);
  if(pairs.length>0 && must>=2){
    const pk = pairs[pairs.length-1]; // 最小对子
    const pairCards = pickCardsForGroup(hand,cat,pk,2);
    const remaining = catCards.filter(c=>!pairCards.includes(c));
    return [...pairCards, ...lowestCards(remaining, must-2)];
  }
  return lowestCards(catCards, must);
}
function selectLowestDiscards(hand, exclude, count, avoidPoints=true){
  const others = hand.filter(c=>!exclude.includes(c));
  return lowestCards(others, count, avoidPoints);
}
function addDiscardCandidates(hand, len, list){
  // 优先选同一花色副牌垫
  for(const s of SUIT_KEYS){
    const suitCards = hand.filter(c=>c.suit===s && !isTrump(c,state.trumpSuit));
    if(suitCards.length>=len){
      list.push({cards:lowestCards(suitCards,len), category:'discard', maxRank:-1});
    }
  }
  if(list.length===0){
    const trumps = trumpCards(hand,state.trumpSuit);
    if(trumps.length>=len){
      list.push({cards:lowestCards(trumps,len), category:'discard', maxRank:-1});
    } else {
      list.push({cards:lowestCards(hand,len), category:'discard', maxRank:-1});
    }
  }
}
function addFollowCandidates(hand, cat, type, len, list, mustFollow){
  const groups = cat==='trump' ? groupTrumpBySuitRank(hand,state.trumpSuit) : groupPlainByRank(hand,cat,state.trumpSuit);
  const ordered = cat==='trump' ? orderedTrumpSuitRanks(state.trumpSuit).map(makeSuitRankKey) : orderedRanksPlain();
  // singles
  const catCards = cat==='trump' ? trumpCards(hand,state.trumpSuit) : suitPlainCards(hand,cat,state.trumpSuit);
  if(type==='single'){
    for(const c of catCards) list.push({cards:[c], category:cat, maxRank: cat==='trump'?trumpRankValue(c,state.trumpSuit):plainRankValue(c)});
    return;
  }
  const pairs = getPairs(groups, ordered);
  const tractors = getTractors(groups, ordered);
  const pairCount = len/2;
  if(type==='pair'){
    if(pairs.length>0){
      for(const k of pairs){
        const cs=pickCardsForGroup(hand,cat,k,2);
        if(cs) list.push({cards:cs, category:cat, maxRank: cat==='trump'?trumpKeyValue(k):PLAIN_RANK_ORDER[k]});
      }
    } else {
      // any two cards
      generateAnyCombinations(catCards, 2, list, cat);
    }
    return;
  }
  if(type==='tractor'){
    const hasLen = tractors.some(t=>t.length===pairCount);
    if(hasLen){
      for(const t of tractors){
        if(t.length!==pairCount) continue;
        const cs=[]; let ok=true;
        for(const k of t){ const g=pickCardsForGroup(hand,cat,k,2); if(!g){ok=false;break;} cs.push(...g); }
        if(ok) list.push({cards:cs, category:cat, maxRank: cat==='trump'?trumpKeyValue(t[0]):PLAIN_RANK_ORDER[t[0]]});
      }
      return;
    }
    // no full tractor: if has pair must play a pair + singles
    if(pairs.length>0){
      // generate one pair + any singles from remaining cat cards
      for(const pk of pairs){
        const pairCards=pickCardsForGroup(hand,cat,pk,2);
        const remaining = catCards.filter(c=>!pairCards.includes(c));
        if(remaining.length>=len-2){
          // choose lowest singles
          const singles = remaining.slice(0,len-2).sort((a,b)=>cardSortValue(a,state.trumpSuit)-cardSortValue(b,state.trumpSuit));
          list.push({cards:[...pairCards,...singles], category:cat, maxRank: cat==='trump'?parseInt(pk):PLAIN_RANK_ORDER[pk]});
        }
      }
      return;
    }
    // all singles
    generateAnyCombinations(catCards, len, list, cat);
  }
}
function generateAnyCombinations(cards, n, list, cat){
  // simple: take any n cards; we generate a few low/high combos
  if(cards.length<n) return;
  const sorted=[...cards].sort((a,b)=>cardSortValue(a,state.trumpSuit)-cardSortValue(b,state.trumpSuit));
  // low combo
  list.push({cards:sorted.slice(0,n), category:cat, maxRank: categoryMax(sorted.slice(0,n),cat)});
  // high combo
  const high=[...cards].sort((a,b)=>cardSortValue(b,state.trumpSuit)-cardSortValue(a,state.trumpSuit));
  list.push({cards:high.slice(0,n), category:cat, maxRank: categoryMax(high.slice(0,n),cat)});
}
function categoryMax(cards, cat){
  if(cat==='trump') return Math.max(...cards.map(c=>trumpRankValue(c,state.trumpSuit)));
  return Math.max(...cards.map(c=>plainRankValue(c)));
}
function playBeats(play, winnerCat, winnerMax, winnerType, leadCat){
  const cat = play.category;
  const tr = typeRank(play.effectiveType);
  const wtr = typeRank(winnerType);
  // 花色不符直接不能赢
  if(cat!=='trump' && cat!==leadCat) return false;
  if(cat==='trump'){
    // 主牌毙副牌：主牌牌型必须不小于副牌牌型（单主不能压副对子/拖拉机）
    if(winnerCat!=='trump') return tr >= wtr;
    if(tr > wtr) return true;
    if(tr < wtr) return false;
    return play.maxRank > winnerMax;
  } else {
    // 跟副牌
    if(winnerCat==='trump') return false;
    if(tr > wtr) return true;
    if(tr < wtr) return false;
    return play.maxRank > winnerMax;
  }
}

// -------------------- finish trick --------------------
async function finishTrick(){
  const lead=state.currentTrick[0];
  let winner;
  if(lead.type==='throw'){
    // 甩牌已通过最大性验证，首家赢得本轮
    winner = lead;
  } else {
    winner=state.currentTrick[0];
    for(let i=1;i<state.currentTrick.length;i++){
      const p=state.currentTrick[i];
      if(playBeats(p, winner.category, winner.maxRank, winner.effectiveType, lead.category)) winner=p;
    }
  }
  const winnerIdx=winner.playerIndex;
  const role = winnerIdx===state.dealerIndex?'庄家':'闲家';
  state.players[winnerIdx].tricksWon++;
  state.currentLeader=winnerIdx;
  updateVoidsFromTrick(state.currentTrick);
  renderCardCounter();
  // points
  let points=0;
  for(const p of state.currentTrick) for(const c of p.cards) points+=scoreValue(c);
  let bottomBonus=0;
  if(role==='闲家'){
    state.defenderPoints += points;
    // 抠底
    if(state.trickCount===TOTAL_TRICKS-1 && winner.category==='trump'){
      let mult=1;
      if(lead.type==='throw'){
        const hasPair = lead.units && lead.units.some(u=>u.type==='pair');
        const hasTractor = lead.units && lead.units.some(u=>u.type==='tractor');
        if(hasTractor) mult=4;
        else if(hasPair) mult=2;
      } else if(lead.type==='pair'){
        mult=2;
      } else if(lead.type==='tractor'){
        mult=4;
      }
      bottomBonus = state.bottomScore * mult;
      state.defenderPoints += bottomBonus;
      log('闲家抠底！底牌 '+state.bottomScore+' 分 ×'+mult+' = '+bottomBonus+' 分');
    }
    log('闲家赢得本轮 '+points+' 分'+(bottomBonus?'（含抠底）':''));
  } else {
    log('庄家赢得本轮，闲家未得分');
  }
  showMessage(state.players[winnerIdx].name+'（'+role+'）赢得本轮');
  updateInfo();
  // 赢墩动画与音效
  let winnerEl=null;
  for(const el of els.trickArea.children){
    if(el.querySelector('.trick-player').textContent===state.players[winner.playerIndex].name){
      winnerEl=el; break;
    }
  }
  if(winnerEl) winnerEl.classList.add('winner-animate');
  playSound(bottomBonus>0?'bottom':'win');
  await sleep(900);
  // 收牌动画
  for(const el of els.trickArea.children) el.classList.add('collect');
  await sleep(400);
  state.currentTrick=[];
  state.trickCount++;
  renderTrick();
  state.turn=winnerIdx;
  if(state.trickCount>=TOTAL_TRICKS){ endRound(); return; }
  startTrick();
}

// -------------------- end round --------------------
function endRound(){
  state.phase='finished';
  showPanel(null);
  const bid=state.bid;
  const score=state.defenderPoints;
  let result='';
  let dealerWin = score < bid;
  if(dealerWin){
    if(score===0) result='大光';
    else if(score<=30) result='小光';
    else result='过庄';
  } else {
    let over = score - bid;
    if(over>=70) result='大倒';
    else if(over>=40) result='小倒';
    else result='垮庄';
  }
  // 记录战绩
  const record = {
    round: state.roundNumber,
    dealer: state.players[state.dealerIndex].name,
    bid: bid,
    score: score,
    result: result,
    dealerWin: dealerWin
  };
  state.roundHistory.push(record);
  if(dealerWin) state.stats.dealerWins++;
  else state.stats.defenderWins++;
  state.stats.totalDefenderPoints += score;
  state.stats.totalBid += bid;

  showMessage('第 '+state.roundNumber+' 局结束：'+result+' · '+(dealerWin?'庄家胜':'闲家胜'));
  playSound('roundEnd');
  log('==== 第 '+state.roundNumber+' 局结束 ====');
  log('闲家得分：'+score+'，庄分：'+bid+'，结果：'+result);
  log(dealerWin?'庄家成功坐庄':'庄家下庄');
  renderScoreboard();
  if(els.btnNext) els.btnNext.style.display = 'inline-block';
  updateInfo();
  renderAllHands();
}
function renderScoreboard(){
  if(!els.scoreboardPanel) return;
  els.scoreboardPanel.classList.add('active');
  if(els.sbTotal) els.sbTotal.textContent = state.roundHistory.length;
  if(els.sbDealerWins) els.sbDealerWins.textContent = state.stats.dealerWins;
  if(els.sbDefenderWins) els.sbDefenderWins.textContent = state.stats.defenderWins;
  if(els.sbTotalPoints) els.sbTotalPoints.textContent = state.stats.totalDefenderPoints;
  if(els.sbBody){
    els.sbBody.innerHTML = state.roundHistory.slice().reverse().map(r=>{
      const cls = r.dealerWin ? 'dealer-win' : 'defender-win';
      return '<tr class="'+cls+'"><td>'+r.round+'</td><td>'+r.dealer+'</td><td>'+r.bid+'</td><td>'+r.score+'</td><td>'+r.result+'</td></tr>';
    }).join('');
  }
}
function renderCardCounter(){
  if(!els.counterPanel || !els.counterPanel.classList.contains('active')) return;
  const trumpSuit = state.trumpSuit;
  let totalRemaining = 0;
  let trumpRemaining = 0;
  const rows = [];
  for(const s of SUIT_KEYS){
    let remaining=0, aces=0, kings=0;
    for(const c of state.deck){
      if(c.suit!==s) continue;
      if(isTrump(c, trumpSuit)){
        if(!state.memory.playedCards.has(c.id)) trumpRemaining++;
        continue;
      }
      if(state.memory.playedCards.has(c.id)) continue;
      remaining++;
      if(c.rank==='A') aces++;
      if(c.rank==='K') kings++;
    }
    totalRemaining += remaining;
    const voids = [];
    for(let i=0;i<4;i++){
      if(i===state.dealerIndex && state.phase==='bidding') continue; // 庄家手牌未知时不显示
      if(state.memory.voids[i][s]) voids.push(state.players[i].name);
    }
    rows.push({suit:s, remaining, aces, kings, voids:voids.join('、')||'-'});
  }
  // 常主（王、7、2）也计入主牌剩余
  for(const c of state.deck){
    if(c.suit==='joker' || c.rank==='7' || c.rank==='2'){
      if(!state.memory.playedCards.has(c.id)) trumpRemaining++;
    }
  }
  totalRemaining += trumpRemaining;
  if(els.cntTotal) els.cntTotal.textContent = totalRemaining;
  if(els.cntTrump) els.cntTrump.textContent = trumpRemaining;
  if(els.cntBody){
    els.cntBody.innerHTML = rows.map(r=>{
      const name = SUITS[r.suit].name + SUITS[r.suit].symbol;
      return '<tr><td>'+name+'</td><td>'+r.remaining+'</td><td>'+r.aces+'</td><td>'+r.kings+'</td><td>'+r.voids+'</td></tr>';
    }).join('');
  }
}

// -------------------- new game --------------------
function startNewRound(preserveStats=true){
  const oldHistory = preserveStats ? state.roundHistory : [];
  const oldStats = preserveStats ? state.stats : {dealerWins:0, defenderWins:0, totalDefenderPoints:0, totalBid:0};
  const oldRoundNumber = preserveStats ? state.roundNumber + 1 : 1;
  const oldDifficulty = state.difficulty || 'medium';
  state = initState();
  state.roundHistory = oldHistory;
  state.stats = oldStats;
  state.roundNumber = oldRoundNumber;
  state.difficulty = oldDifficulty;
  state.startBidder = randInt(4);
  state.turn = state.startBidder;
  if(els.scoreboardPanel) els.scoreboardPanel.classList.remove('active');
  if(els.btnNext) els.btnNext.style.display = 'none';
  log('第 '+state.roundNumber+' 局开始，从 '+state.players[state.startBidder].name+' 开始叫分');
  deal();
  playSound('deal');
  updateInfo();
  renderAllHands();
  // begin bidding
  if(state.turn===HUMAN_INDEX){
    setBidOptions();
    showPanel('bid');
    showMessage('请叫分 80 或不叫');
  } else {
    showPanel(null);
    setTimeout(()=>aiBid(state.turn), 600);
  }
}

document.getElementById('btn-new').onclick = ()=> startNewRound(false);
if(els.btnNext){
  els.btnNext.onclick = ()=> startNewRound(true);
}
if(els.btnReset){
  els.btnReset.onclick = ()=>{
    state.roundHistory = [];
    state.stats = {dealerWins:0, defenderWins:0, totalDefenderPoints:0, totalBid:0};
    state.roundNumber = 1;
    if(els.scoreboardPanel) els.scoreboardPanel.classList.remove('active');
    if(els.counterPanel) els.counterPanel.classList.remove('active');
    if(els.btnNext) els.btnNext.style.display = 'none';
    updateInfo();
    renderScoreboard();
    showMessage('战绩已重置');
  };
}
if(els.btnCounter){
  els.btnCounter.onclick = ()=>{
    if(!els.counterPanel) return;
    els.counterPanel.classList.toggle('active');
    renderCardCounter();
  };
}

// 按钮点击音效
document.getElementById('controls').addEventListener('click', (e)=>{
  if(e.target.tagName==='BUTTON') playSound('click');
});
if(els.difficultySelect){
  els.difficultySelect.value = state.difficulty || 'medium';
  els.difficultySelect.onchange = ()=>{
    state.difficulty = els.difficultySelect.value;
    showMessage('AI 难度已设置为：'+(state.difficulty==='easy'?'简单':state.difficulty==='hard'?'困难':'普通'));
  };
}

// initial render
state = initState();
updateInfo();
</script>
